name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: backend

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gestoria
          POSTGRES_PASSWORD: gestoria
          POSTGRES_DB: gestoria_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gestoria"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      SECRET_KEY: ci-only-secret-key
      DATABASE_URL: postgresql+asyncpg://gestoria:gestoria@localhost:5432/gestoria_test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Formato (ruff format --check)
        run: ruff format --check .

      - name: Tipado (mypy)
        run: mypy app

      - name: Migraciones (alembic upgrade head)
        run: alembic upgrade head

      - name: Tests (pytest)
        run: pytest --cov=app --cov-report=term-missing
