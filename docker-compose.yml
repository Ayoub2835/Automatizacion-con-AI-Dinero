services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gestoria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gestoria}
      POSTGRES_DB: ${POSTGRES_DB:-gestoria}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gestoria}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: development
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-gestoria}:${POSTGRES_PASSWORD:-gestoria}@db:5432/${POSTGRES_DB:-gestoria}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      target: development
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # URL interna de red Docker: el navegador nunca llama al backend
      # directamente (ver ADR 0007), solo el servidor de Next.js.
      API_URL: http://backend:8000/api/v1
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: npm run dev

volumes:
  pgdata:
